<app-auth-layout>
  <header class="card-header">
    <a class="back" routerLink="/login" aria-label="Zurück zur Anmeldung">
      <img src="/icons/arrow-back.svg" alt="" width="24" height="24" />
    </a>
    <h1>Neues Passwort</h1>
  </header>

  @if (linkError()) {
    <p class="dead-end" role="alert" data-testid="link-error">
      Dieser Link ist ungültig oder abgelaufen.
    </p>
    <div class="actions">
      <button appButton type="button" routerLink="/passwort-vergessen" data-testid="retry-reset">
        Neuen Link anfordern
      </button>
    </div>
  } @else {
    <p class="lead">Bitte geben Sie Ihr neues Passwort ein.</p>

    <form [formGroup]="form" (ngSubmit)="submit()">
      <app-text-field
        formControlName="password"
        type="password"
        placeholder="Neues Passwort"
        icon="/icons/lock.svg"
        autocomplete="new-password"
        [error]="passwordError()"
      />

      <app-text-field
        formControlName="confirm"
        type="password"
        placeholder="Passwort bestätigen"
        icon="/icons/lock.svg"
        autocomplete="new-password"
        [error]="confirmError()"
      />

      @if (formError()) {
        <p class="form-error" role="alert">{{ formError() }}</p>
      }

      <div class="actions">
        <button appButton type="submit" data-testid="reset-submit" [disabled]="form.invalid || busy()">
          Passwort ändern
        </button>
      </div>
    </form>
  }
</app-auth-layout>
