<app-auth-layout>
  <header class="card-header">
    <a class="back" routerLink="/login" aria-label="Zurück zur Anmeldung">
      <img src="/icons/arrow-back.svg" alt="" width="24" height="24" />
    </a>
    <h1>Passwort zurücksetzen</h1>
  </header>

  <p class="lead">Bitte geben Sie Ihre E-Mail-Adresse ein.</p>
  <p class="lead">
    Wir senden Ihnen eine E-Mail, über die Sie Ihr Passwort ändern können.
  </p>

  <form [formGroup]="form" (ngSubmit)="submit()">
    <app-text-field
      formControlName="email"
      type="email"
      placeholder="beispielname@email.com"
      icon="/icons/mail.svg"
      autocomplete="email"
      [error]="emailError()"
    />

    @if (formError()) {
      <p class="form-error" role="alert">{{ formError() }}</p>
    }

    <div class="actions">
      <button appButton type="submit" data-testid="send-reset" [disabled]="form.invalid || busy()">
        E-Mail senden
      </button>
    </div>
  </form>
</app-auth-layout>
